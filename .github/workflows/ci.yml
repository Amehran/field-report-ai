name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Lint Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}
          
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
        
      - name: Create mock google-services.json for build
        run: |
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "mock-project",
              "storage_bucket": "mock-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.fieldreport.ai"
                  }
                },
                "api_key": [
                  {
                    "current_key": "mock-api-key"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Build and Lint Android
        run: ./gradlew lintDebug assembleDebug --parallel --build-cache

  build-backend:
    name: Build & Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json
          
      - name: Install dependencies
        run: npm ci

      - name: Typecheck / Lint backend
        run: npx tsc --noEmit
        
      - name: Build backend
        run: npm run build


