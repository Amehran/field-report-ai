name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Lint Android & KMP Shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
          
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
        
      - name: Create mock google-services.json for build
        run: |
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "mock-project",
              "storage_bucket": "mock-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.fieldreport.ai"
                  }
                },
                "api_key": [
                  {
                    "current_key": "mock-api-key"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Test, Lint & Build Android & KMP Shared
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:+UseG1GC' -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: ./gradlew test lintDebug assembleDebug --parallel --build-cache

  build-ios:
    name: Build & Test iOS App (KMP)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build KMP iOS Framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Build iOS App with xcodebuild
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -sdk iphonesimulator build

  build-backend:
    name: Build & Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json
          
      - name: Install dependencies
        run: npm ci

      - name: Typecheck / Lint backend
        run: npx tsc --noEmit
        
      - name: Build backend
        run: npm run build
        
      - name: Run Backend Tests & Coverage
        run: npm run test:coverage
